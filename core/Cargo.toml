[package]
name = "devassist"
version = "0.1.0"
edition = "2021"
description = "DevAssist CLI — polyglot lab (Rust + Ruby + Lua), 100% offline"

[[bin]]
name = "devassist"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
mlua = { version = "0.10", features = ["lua54", "vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
